<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng Chấm Thi - EduMath</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #f3f4f6; }
        .card { transition: all 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.1); }
        .loader { border: 4px solid #f3f3f3; border-radius: 50%; border-top: 4px solid #2563eb; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* Thanh cuộn đẹp */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="min-h-screen">

    <div class="bg-white border-b-4 border-blue-600 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-blue-100 p-2 rounded-lg text-2xl">👨‍🏫</div>
                <div>
                    <h1 class="text-2xl font-black text-blue-800 uppercase leading-none">Phòng Chấm Thi</h1>
                    <p class="text-sm text-gray-500 font-bold mt-1">Giáo viên: Thầy Tuyên</p>
                </div>
            </div>
            
            <div class="flex flex-wrap gap-2">
                <select id="filterMon" onchange="renderDanhSach()" class="border-2 border-gray-200 p-2 rounded-lg font-bold text-gray-600 focus:border-blue-500 focus:text-blue-700 outline-none cursor-pointer">
                    <option value="all">📚 Tất cả môn</option>
                    <option value="Khoa Học">🧪 Khoa Học</option>
                    <option value="Toán">🧮 Toán</option>
                    <option value="Tiếng Việt">📖 Tiếng Việt</option>
                </select>
                <button onclick="taiDuLieu()" class="bg-blue-100 hover:bg-blue-200 text-blue-700 px-4 py-2 rounded-lg font-bold transition flex items-center gap-2">
                    🔄 Làm mới
                </button>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto p-4 md:p-6">
        
        <div id="loading" class="text-center py-20 hidden">
            <div class="loader"></div>
            <p class="mt-4 text-gray-500 font-bold animate-pulse">Đang kết nối dữ liệu...</p>
        </div>

        <div id="danhSachBaiThi" class="grid grid-cols-1 gap-8">
            </div>

    </div>

    <script>
        // 1. CẤU HÌNH FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyA77lLi_JCLIdR535KEfg3S0_Ge2EorPMo", 
            authDomain: "baikiemtracuoiki.firebaseapp.com",
            projectId: "baikiemtracuoiki",
            storageBucket: "baikiemtracuoiki.appspot.com",
            messagingSenderId: "953819948776",
            appId: "1:953819948776:web:15848507d350f37c35e5d3"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let tatCaBaiThi = [];

        // Tự động tải dữ liệu khi mở trang
        window.onload = function() {
            taiDuLieu();
        }

        // 2. TẢI DỮ LIỆU
        function taiDuLieu() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('danhSachBaiThi').innerHTML = '';
            
            db.collection("Baikiemtracuoiki").get()
                .then((querySnapshot) => {
                    tatCaBaiThi = [];
                    querySnapshot.forEach((doc) => {
                        tatCaBaiThi.push({ id: doc.id, ...doc.data() });
                    });
                    
                    // Sắp xếp: Mới nhất lên đầu
                    tatCaBaiThi.sort((a, b) => new Date(b.thoi_gian_nop) - new Date(a.thoi_gian_nop));
                    
                    renderDanhSach();
                    document.getElementById('loading').style.display = 'none';
                })
                .catch((error) => {
                    console.error(error);
                    alert("Lỗi tải dữ liệu: " + error.message + "\n(Thầy kiểm tra lại Rules trong Firebase nhé)");
                    document.getElementById('loading').style.display = 'none';
                });
        }

        // 3. HIỂN THỊ DANH SÁCH
        function renderDanhSach() {
            const container = document.getElementById('danhSachBaiThi');
            const filter = document.getElementById('filterMon').value;
            container.innerHTML = '';

            // Lọc môn học (Không phân biệt hoa thường)
            const dsLoc = filter === 'all' ? tatCaBaiThi : tatCaBaiThi.filter(bai => {
                return bai.mon_hoc && bai.mon_hoc.toLowerCase().includes(filter.toLowerCase());
            });

            if(dsLoc.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 bg-white rounded-xl shadow-sm border border-gray-200">
                        <div class="text-6xl mb-4">📭</div>
                        <h3 class="text-xl font-bold text-gray-800">Chưa có bài thi nào</h3>
                        <p class="text-gray-500">Hãy yêu cầu học sinh nộp bài để xem kết quả tại đây.</p>
                    </div>`;
                return;
            }

            dsLoc.forEach(bai => {
                const monHoc = bai.mon_hoc || "Không rõ";
                const isTiengViet = monHoc.toLowerCase().includes('tiếng việt');
                const diemTN = bai.diem_trac_nghiem || 0;
                
                // Trạng thái chấm
                let daCham = false;
                if (isTiengViet) {
                    daCham = (bai.trang_thai_doc === "Đã chấm" && bai.trang_thai_viet === "Đã chấm");
                } else {
                    daCham = (bai.diem_tu_luan > 0);
                }

                const statusHTML = daCham 
                    ? `<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold border border-green-200 flex items-center gap-1">✅ Đã chấm</span>`
                    : `<span class="bg-orange-100 text-orange-700 px-3 py-1 rounded-full text-xs font-bold border border-orange-200 flex items-center gap-1 animate-pulse">⏳ Chờ chấm</span>`;

                const borderStatus = daCham ? 'border-green-500' : 'border-orange-400';

                // Tạo nội dung thẻ
                let html = `
                <div class="bg-white rounded-xl shadow-lg border-l-8 ${borderStatus} card overflow-hidden flex flex-col md:flex-row">
                    
                    <div class="md:w-7/12 p-6 border-r border-gray-100 flex flex-col">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="text-2xl font-black text-gray-800">${bai.ho_ten}</h3>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="bg-gray-100 text-gray-600 px-2 py-0.5 rounded text-sm font-bold">Lớp ${bai.lop}</span>
                                    <span class="text-gray-300">|</span>
                                    <span class="text-blue-600 font-bold uppercase text-sm">${monHoc}</span>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-3xl font-black text-blue-600">${diemTN}đ</div>
                                <div class="text-xs font-bold text-gray-400 uppercase tracking-wider">Trắc nghiệm</div>
                            </div>
                        </div>

                        <div class="flex-1 bg-gray-50 rounded-lg border border-gray-200 p-0 flex flex-col overflow-hidden h-96 md:h-full">
                            <div class="bg-gray-200 px-4 py-2 text-xs font-bold text-gray-600 uppercase flex justify-between items-center">
                                <span>📄 Nội dung bài làm</span>
                                <span class="text-gray-400">${new Date(bai.thoi_gian_nop).toLocaleString('vi-VN')}</span>
                            </div>
                            <div class="flex-1 p-4 overflow-y-auto font-mono text-sm leading-relaxed whitespace-pre-wrap text-gray-800">
                                ${bai.bai_tu_luan || '<em class="text-gray-400">Không có dữ liệu bài làm.</em>'}
                            </div>
                        </div>
                    </div>

                    <div class="md:w-5/12 p-6 bg-blue-50/30 flex flex-col justify-center space-y-5">
                        <div class="flex justify-between items-center">
                            <h4 class="font-bold text-blue-800 flex items-center gap-2">
                                ✏️ PHẦN GIÁO VIÊN
                            </h4>
                            ${statusHTML}
                        </div>

                        ${isTiengViet ? `
                            <div class="space-y-3">
                                <div>
                                    <label class="block text-xs font-bold text-green-700 mb-1">Điểm Đọc thành tiếng (Max 3đ):</label>
                                    <input type="number" id="diemDoc_${bai.id}" value="${bai.diem_doc_thanh_tieng || ''}" class="w-full border-2 border-green-200 focus:border-green-500 p-2.5 rounded-lg font-bold text-green-700 outline-none transition" placeholder="Nhập điểm...">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-purple-700 mb-1">Điểm Viết TLV (Max 10đ):</label>
                                    <input type="number" id="diemViet_${bai.id}" value="${bai.diem_viet || ''}" class="w-full border-2 border-purple-200 focus:border-purple-500 p-2.5 rounded-lg font-bold text-purple-700 outline-none transition" placeholder="Nhập điểm...">
                                </div>
                            </div>
                        ` : `
                            <div>
                                <label class="block text-xs font-bold text-orange-700 mb-1">Điểm Tự Luận (Max 6đ):</label>
                                <div class="relative">
                                    <input type="number" id="diemTuLuan_${bai.id}" value="${bai.diem_tu_luan || ''}" class="w-full border-2 border-orange-200 focus:border-orange-500 p-3 pl-4 rounded-lg font-bold text-orange-700 text-lg outline-none transition" placeholder="0">
                                    <span class="absolute right-4 top-3.5 text-gray-400 font-bold text-sm">/ 6.0</span>
                                </div>
                            </div>
                        `}

                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">Lời phê / Nhận xét:</label>
                            <textarea id="loiPhe_${bai.id}" rows="3" class="w-full border border-gray-300 p-3 rounded-lg text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition resize-none" placeholder="Nhập lời phê của thầy...">${bai.nhan_xet || ''}</textarea>
                        </div>

                        <button onclick="luuDiem('${bai.id}', '${monHoc}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md hover:shadow-lg transition transform active:scale-95 flex justify-center items-center gap-2 group">
                            <span class="group-hover:hidden">💾 LƯU KẾT QUẢ</span>
                            <span class="hidden group-hover:block">💾 LƯU NGAY</span>
                        </button>
                    </div>
                </div>
                `;
                container.innerHTML += html;
            });
        }

        // 4. LƯU ĐIỂM
        function luuDiem(docId, monHoc) {
            const btn = event.target.closest('button');
            const originalHTML = btn.innerHTML;
            
            btn.innerHTML = "⏳ Đang lưu...";
            btn.disabled = true;
            btn.classList.add('opacity-75');

            const isTiengViet = monHoc.toLowerCase().includes('tiếng việt');
            let dataUpdate = {};

            try {
                const loiPhe = document.getElementById(`loiPhe_${docId}`).value;
                dataUpdate['nhan_xet'] = loiPhe;

                if (isTiengViet) {
                    const dDoc = parseFloat(document.getElementById(`diemDoc_${docId}`).value);
                    const dViet = parseFloat(document.getElementById(`diemViet_${docId}`).value);
                    if (isNaN(dDoc) || isNaN(dViet)) throw new Error("Vui lòng nhập đủ điểm Đọc và Viết!");
                    dataUpdate['diem_doc_thanh_tieng'] = dDoc;
                    dataUpdate['diem_viet'] = dViet;
                    dataUpdate['trang_thai_doc'] = "Đã chấm";
                    dataUpdate['trang_thai_viet'] = "Đã chấm";
                } else {
                    const dTuLuan = parseFloat(document.getElementById(`diemTuLuan_${docId}`).value);
                    if (isNaN(dTuLuan)) throw new Error("Vui lòng nhập điểm Tự luận!");
                    dataUpdate['diem_tu_luan'] = dTuLuan;
                }

                db.collection("Baikiemtracuoiki").doc(docId).update(dataUpdate)
                    .then(() => {
                        btn.innerHTML = "✅ ĐÃ LƯU!";
                        btn.classList.replace('bg-blue-600', 'bg-green-600');
                        
                        // Cập nhật giao diện mà không cần load lại trang
                        const card = btn.closest('.card');
                        card.classList.replace('border-orange-400', 'border-green-500');
                        // Cập nhật badge
                        const badgeContainer = card.querySelector('.bg-orange-100')?.parentNode;
                        if(badgeContainer) {
                             badgeContainer.innerHTML = `<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold border border-green-200 flex items-center gap-1">✅ Đã chấm</span>`;
                        }

                        setTimeout(() => { 
                            btn.disabled = false; 
                            btn.innerHTML = originalHTML; 
                            btn.classList.replace('bg-green-600', 'bg-blue-600');
                            btn.classList.remove('opacity-75');
                        }, 2000);
                    })
                    .catch((error) => {
                        alert("Lỗi lưu: " + error.message);
                        btn.innerHTML = originalHTML;
                        btn.disabled = false;
                        btn.classList.remove('opacity-75');
                    });

            } catch (e) {
                alert("⚠️ " + e.message);
                btn.innerHTML = originalHTML;
                btn.disabled = false;
                btn.classList.remove('opacity-75');
            }
        }
    </script>
</body>
</html>
