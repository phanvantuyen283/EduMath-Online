<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng Chấm Thi - Bảo Mật</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

    <style>
        body { font-family: 'Nunito', sans-serif; }
        .card { transition: all 0.3s; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .loader { border: 4px solid #f3f3f3; border-radius: 50%; border-top: 4px solid #3498db; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* Tùy chỉnh thanh cuộn */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <div id="login-screen" class="fixed inset-0 bg-blue-900 z-50 flex items-center justify-center">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-96 text-center">
            <h2 class="text-2xl font-black text-blue-800 mb-2">🔐 ĐĂNG NHẬP GIÁO VIÊN</h2>
            <p class="text-gray-500 text-sm mb-6">Hệ thống bảo mật Firebase Auth</p>
            
            <div class="text-left mb-4">
                <label class="block text-xs font-bold text-gray-500 uppercase">Email quản trị:</label>
                <input type="email" id="emailGV" class="w-full border-2 border-gray-300 p-3 rounded mt-1 focus:border-blue-500 outline-none font-bold text-blue-800" placeholder="Nhập email...">
            </div>

            <div class="text-left mb-6">
                <label class="block text-xs font-bold text-gray-500 uppercase">Mật khẩu:</label>
                <input type="password" id="matKhau" class="w-full border-2 border-gray-300 p-3 rounded mt-1 focus:border-blue-500 outline-none" placeholder="Nhập mật khẩu...">
            </div>

            <button onclick="dangNhap()" id="btnLogin" class="w-full bg-blue-600 text-white font-bold py-3 rounded hover:bg-blue-700 transition shadow-lg">
                XÁC THỰC & VÀO CHẤM THI
            </button>
            <p id="loginError" class="text-red-500 text-xs mt-3 italic hidden"></p>
        </div>
    </div>

    <div id="main-app" class="hidden p-4 md:p-6 max-w-7xl mx-auto">
        
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-4 rounded-xl shadow-md sticky top-0 z-40 border-b-4 border-blue-500">
            <div>
                <h1 class="text-2xl font-black text-blue-800 uppercase flex items-center gap-2">
                    <span>🖊️ PHÒNG CHẤM THI</span>
                    <span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded border border-green-200">Đã bảo mật</span>
                </h1>
                <p class="text-gray-500 text-sm">Xin chào, <span id="userEmailDisplay" class="font-bold text-blue-600">Thầy Giáo</span></p>
            </div>
            
            <div class="flex flex-wrap justify-center gap-3 mt-4 md:mt-0">
                <select id="filterMon" onchange="renderDanhSach()" class="border-2 border-gray-200 p-2 rounded font-bold text-gray-700 focus:border-blue-500 outline-none">
                    <option value="all">📚 Tất cả môn</option>
                    <option value="Khoa Học">Khoa Học</option>
                    <option value="Toán">Toán</option>
                    <option value="Tiếng Việt">Tiếng Việt</option>
                    <option value="Sử - Địa">Sử - Địa</option>
                </select>
                <button onclick="taiDuLieu()" class="bg-blue-100 text-blue-700 px-4 py-2 rounded font-bold hover:bg-blue-200 transition">🔄 Làm mới</button>
                <button onclick="dangXuat()" class="bg-red-100 text-red-700 px-4 py-2 rounded font-bold hover:bg-red-200 transition">🚪 Thoát</button>
            </div>
        </div>

        <div id="loading" class="text-center py-10 hidden">
            <div class="loader"></div>
            <p class="mt-4 text-gray-500 font-bold">Đang tải dữ liệu bài thi...</p>
        </div>

        <div id="danhSachBaiThi" class="grid grid-cols-1 gap-6">
            </div>

    </div>

    <script>
        // 1. CẤU HÌNH FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyA77lLi_JCLIdR535KEfg3S0_Ge2EorPMo", 
            authDomain: "baikiemtracuoiki.firebaseapp.com",
            projectId: "baikiemtracuoiki",
            storageBucket: "baikiemtracuoiki.appspot.com",
            messagingSenderId: "953819948776",
            appId: "1:953819948776:web:15848507d350f37c35e5d3"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let tatCaBaiThi = [];

        // 2. XỬ LÝ ĐĂNG NHẬP
        // Tự động kiểm tra xem thầy đã đăng nhập chưa
        auth.onAuthStateChanged((user) => {
            if (user) {
                // Đã đăng nhập
                document.getElementById('userEmailDisplay').innerText = user.email;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').classList.remove('hidden');
                taiDuLieu();
            } else {
                // Chưa đăng nhập
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('main-app').classList.add('hidden');
            }
        });

        function dangNhap() {
            const email = document.getElementById('emailGV').value;
            const pass = document.getElementById('matKhau').value;
            const btn = document.getElementById('btnLogin');
            const err = document.getElementById('loginError');

            if(!email || !pass) {
                err.innerText = "Vui lòng nhập Email và Mật khẩu!";
                err.classList.remove('hidden');
                return;
            }
            
            btn.innerText = "⏳ Đang xác thực..."; 
            btn.disabled = true;

            auth.signInWithEmailAndPassword(email, pass)
                .catch((error) => {
                    console.error(error);
                    btn.innerText = "XÁC THỰC & VÀO CHẤM THI"; 
                    btn.disabled = false;
                    err.innerText = "Sai thông tin! (Lỗi: " + error.message + ")";
                    err.classList.remove('hidden');
                });
        }

        function dangXuat() {
            if(confirm("Thầy có chắc muốn thoát không?")) {
                auth.signOut().then(() => location.reload());
            }
        }

        // 3. TẢI DỮ LIỆU
        function taiDuLieu() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('danhSachBaiThi').innerHTML = '';
            
            db.collection("Baikiemtracuoiki").get()
                .then((querySnapshot) => {
                    tatCaBaiThi = [];
                    querySnapshot.forEach((doc) => {
                        tatCaBaiThi.push({ id: doc.id, ...doc.data() });
                    });
                    
                    // Sắp xếp: Mới nhất lên đầu
                    tatCaBaiThi.sort((a, b) => new Date(b.thoi_gian_nop) - new Date(a.thoi_gian_nop));
                    
                    renderDanhSach();
                    document.getElementById('loading').style.display = 'none';
                })
                .catch((error) => {
                    alert("LỖI TẢI DỮ LIỆU: " + error.message + "\n(Thầy kiểm tra lại Firestore Rules chưa?)");
                    document.getElementById('loading').style.display = 'none';
                });
        }

        // 4. HIỂN THỊ DANH SÁCH (RENDER)
        function renderDanhSach() {
            const container = document.getElementById('danhSachBaiThi');
            const filter = document.getElementById('filterMon').value;
            container.innerHTML = '';

            // Lọc môn học
            const dsLoc = filter === 'all' ? tatCaBaiThi : tatCaBaiThi.filter(bai => {
                // Xử lý chuỗi tương đối để tránh lỗi chữ hoa/thường
                return bai.mon_hoc && bai.mon_hoc.toLowerCase().includes(filter.toLowerCase());
            });

            if(dsLoc.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 bg-white rounded shadow text-gray-400">
                        <p class="text-4xl mb-2">📭</p>
                        <p>Không tìm thấy bài thi nào.</p>
                    </div>`;
                return;
            }

            dsLoc.forEach(bai => {
                const isTiengViet = bai.mon_hoc && bai.mon_hoc.toLowerCase().includes('tiếng việt');
                const diemTN = bai.diem_trac_nghiem || 0;
                
                // Logic trạng thái
                let daCham = false;
                if (isTiengViet) {
                    daCham = (bai.trang_thai_doc === "Đã chấm" && bai.trang_thai_viet === "Đã chấm");
                } else {
                    daCham = (bai.diem_tu_luan > 0);
                }

                const borderClass = daCham ? 'border-green-500' : 'border-gray-200';
                const statusBadge = daCham 
                    ? '<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold border border-green-200 flex items-center gap-1">✅ Đã chấm xong</span>' 
                    : '<span class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-xs font-bold border border-red-200 flex items-center gap-1 animate-pulse">⏳ Chờ chấm</span>';

                let html = `
                <div class="bg-white rounded-xl shadow border-l-8 ${borderClass} card p-6 relative overflow-hidden">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 border-b border-gray-100 pb-4">
                        <div>
                            <h3 class="text-xl font-black text-gray-800 flex items-center gap-2">
                                ${bai.ho_ten} 
                                <span class="text-sm font-bold bg-gray-100 text-gray-600 px-2 py-0.5 rounded">${bai.lop}</span>
                            </h3>
                            <div class="flex items-center gap-3 mt-1 text-sm">
                                <span class="font-bold text-blue-600 uppercase tracking-wide">${bai.mon_hoc}</span>
                                <span class="text-gray-300">|</span>
                                <span class="text-gray-500">Nộp lúc: ${new Date(bai.thoi_gian_nop).toLocaleString('vi-VN')}</span>
                            </div>
                        </div>
                        <div class="mt-4 md:mt-0 text-right">
                            <div class="mb-1 flex justify-end">${statusBadge}</div>
                            <div class="text-2xl font-black text-blue-800">${diemTN} <span class="text-xs font-bold text-gray-400 uppercase">Điểm TN</span></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div class="bg-gray-50 p-5 rounded-lg border border-gray-200 shadow-inner flex flex-col h-full">
                            <h4 class="font-bold text-gray-700 mb-3 flex items-center gap-2 border-b pb-2">
                                📄 BÀI LÀM CỦA HỌC SINH
                            </h4>
                            <div class="flex-1 overflow-y-auto max-h-80 pr-2 custom-scroll">
                                <div class="whitespace-pre-wrap text-sm text-gray-800 font-mono leading-relaxed bg-white p-3 rounded border border-gray-200">
                                    ${bai.bai_tu_luan || '<em class="text-gray-400">Không có nội dung tự luận.</em>'}
                                </div>
                                ${bai.bai_doc_random ? `<p class="mt-2 text-xs font-bold text-indigo-600">📖 Đề bài đọc: ${bai.bai_doc_random}</p>` : ''}
                            </div>
                        </div>

                        <div class="space-y-4 bg-blue-50/50 p-5 rounded-lg border border-blue-100">
                            <h4 class="font-bold text-blue-800 mb-2 border-b border-blue-200 pb-2 flex items-center gap-2">
                                📝 GIÁO VIÊN CHẤM ĐIỂM
                            </h4>
                            
                            ${isTiengViet ? `
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs font-bold text-green-700 mb-1">Đọc thành tiếng (Max 3đ):</label>
                                        <input type="number" id="diemDoc_${bai.id}" value="${bai.diem_doc_thanh_tieng || ''}" class="w-full border-2 border-green-200 focus:border-green-500 p-2 rounded font-bold text-green-700 text-center outline-none" placeholder="0 - 3">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-purple-700 mb-1">Viết TLV (Max 10đ):</label>
                                        <input type="number" id="diemViet_${bai.id}" value="${bai.diem_viet || ''}" class="w-full border-2 border-purple-200 focus:border-purple-500 p-2 rounded font-bold text-purple-700 text-center outline-none" placeholder="0 - 10">
                                    </div>
                                </div>
                            ` : `
                                <div>
                                    <label class="block text-xs font-bold text-orange-700 mb-1">Điểm Tự luận (Max 6đ):</label>
                                    <div class="flex items-center gap-2">
                                        <input type="number" id="diemTuLuan_${bai.id}" value="${bai.diem_tu_luan || ''}" class="w-full border-2 border-orange-200 focus:border-orange-500 p-2 rounded font-bold text-orange-700 text-lg outline-none" placeholder="Nhập điểm...">
                                        <span class="text-gray-500 font-bold text-sm">/ 6.0</span>
                                    </div>
                                </div>
                            `}

                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">Lời phê / Dặn dò:</label>
                                <textarea id="loiPhe_${bai.id}" rows="2" class="w-full border border-gray-300 p-2 rounded text-sm focus:border-blue-500 outline-none" placeholder="Nhập nhận xét của thầy...">${bai.nhan_xet || ''}</textarea>
                            </div>

                            <button onclick="luuDiem('${bai.id}', '${bai.mon_hoc}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition transform active:scale-95 flex justify-center items-center gap-2">
                                💾 LƯU KẾT QUẢ
                            </button>
                        </div>
                    </div>
                </div>
                `;
                container.innerHTML += html;
            });
        }

        // 5. LƯU ĐIỂM
        function luuDiem(docId, monHoc) {
            const btn = event.target; // Lấy nút đang bấm
            const originalText = btn.innerHTML;
            btn.innerHTML = "⏳ Đang lưu...";
            btn.disabled = true;

            const isTiengViet = monHoc && monHoc.toLowerCase().includes('tiếng việt');
            let dataUpdate = {};

            try {
                const loiPhe = document.getElementById(`loiPhe_${docId}`).value;
                dataUpdate['nhan_xet'] = loiPhe;

                if (isTiengViet) {
                    const dDoc = parseFloat(document.getElementById(`diemDoc_${docId}`).value);
                    const dViet = parseFloat(document.getElementById(`diemViet_${docId}`).value);
                    
                    if (isNaN(dDoc) || isNaN(dViet)) { throw new Error("Vui lòng nhập đủ điểm Đọc và Viết!"); }
                    
                    dataUpdate['diem_doc_thanh_tieng'] = dDoc;
                    dataUpdate['diem_viet'] = dViet;
                    dataUpdate['trang_thai_doc'] = "Đã chấm";
                    dataUpdate['trang_thai_viet'] = "Đã chấm";
                } else {
                    const dTuLuan = parseFloat(document.getElementById(`diemTuLuan_${docId}`).value);
                    if (isNaN(dTuLuan)) { throw new Error("Chưa nhập điểm tự luận!"); }
                    dataUpdate['diem_tu_luan'] = dTuLuan;
                }

                db.collection("Baikiemtracuoiki").doc(docId).update(dataUpdate)
                    .then(() => {
                        // Hiệu ứng thành công
                        btn.innerHTML = "✅ ĐÃ LƯU!";
                        btn.classList.replace('bg-blue-600', 'bg-green-600');
                        
                        const card = btn.closest('.card');
                        card.classList.remove('border-gray-200');
                        card.classList.add('border-green-500');

                        // Cập nhật lại dữ liệu cục bộ để không phải tải lại trang
                        const baiIndex = tatCaBaiThi.findIndex(b => b.id === docId);
                        if (baiIndex > -1) {
                            tatCaBaiThi[baiIndex] = { ...tatCaBaiThi[baiIndex], ...dataUpdate };
                        }

                        setTimeout(() => { 
                            btn.disabled = false; 
                            btn.innerHTML = originalText; 
                            btn.classList.replace('bg-green-600', 'bg-blue-600');
                        }, 2000);
                    })
                    .catch((error) => {
                        console.error("Lỗi:", error);
                        alert("⚠️ Lỗi lưu điểm: " + error.message);
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                    });

            } catch (e) {
                alert("⚠️ Lỗi nhập liệu: " + e.message);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
